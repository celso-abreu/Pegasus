name: Build release APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build Android release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/pegasus-release.jks"

          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" && -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "Keystore password secrets are required when ANDROID_KEYSTORE_BASE64 is configured." >&2
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            store_password="$ANDROID_KEYSTORE_PASSWORD"
            key_password="$ANDROID_KEY_PASSWORD"
          else
            # A temporary key makes this artifact installable, but cannot be reused to update
            # an APK signed by another workflow run. Configure the repository secrets for releases.
            store_password="$(openssl rand -hex 24)"
            key_password="$store_password"
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -storepass "$store_password" \
              -keypass "$key_password" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Pegasus GitHub Actions"
          fi

          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "KEYSTORE_PATH=$keystore_path"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pegasus-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
